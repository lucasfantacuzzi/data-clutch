name: Release

# Push a tag like v0.1.0 to build Linux, macOS and Windows binaries and attach
# them to a draft GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            args: -tags webkit2_41
          - os: macos-latest
            name: macos-universal
            args: -platform darwin/universal
          - os: windows-latest
            name: windows-amd64
            args: -platform windows/amd64 -nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Windows installer tooling
        if: runner.os == 'Windows'
        run: choco install nsis -y
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - run: wails build -clean ${{ matrix.args }}
      - name: Package
        shell: bash
        run: |
          cd build/bin
          case "${{ matrix.name }}" in
            macos-*)   ditto -c -k --keepParent data-clutch.app ../../data-clutch-${{ matrix.name }}.zip ;;
            linux-*)   tar czf ../../data-clutch-${{ matrix.name }}.tar.gz data-clutch ;;
            windows-*) 7z a ../../data-clutch-${{ matrix.name }}.zip *.exe ;;
          esac
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            data-clutch-${{ matrix.name }}.*
