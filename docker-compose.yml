services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: clutch
      POSTGRES_DB: clutch
    ports: ["55432:5432"]
    # one slot for the app; the reserved ones mimic a server that refuses extra sessions
    command: ["postgres", "-c", "max_connections=4", "-c", "superuser_reserved_connections=3"]
  redis:
    image: redis:7
    ports: ["56379:6379"]
